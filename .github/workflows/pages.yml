name: pages

# Deploys the web table as a static replay viewer: the built single-file page as
# index.html with the showcase bundle beside it as replay.json, which the page
# plays on load. Needs Pages enabled with source "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run build
        working-directory: webui
      - run: |
          mkdir _site
          cp jongbench/webui_page.html _site/index.html
          gunzip -c assets/showcase-replay.json.gz > _site/replay.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
