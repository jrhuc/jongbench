name: Release verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      JONGBENCH_CACHE_DIR: ${{ github.workspace }}/.cache/jongbench
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run build --check
        working-directory: webui
      - run: uv run --frozen --python ${{ matrix.python-version }} --extra dev pytest -q
      - if: matrix.python-version == '3.12'
        name: Create hermetic selfcheck reviewer
        run: |
          uv run --frozen --python ${{ matrix.python-version }} --extra dev python - <<'PY'
          import os
          from pathlib import Path
          import torch
          from jongbench.mortal_model import Brain, DQN

          path = Path(os.environ["RUNNER_TEMP"]) / "selfcheck-reviewer.pth"
          torch.manual_seed(7)
          brain = Brain(version=4, num_blocks=0, conv_channels=4)
          dqn = DQN(version=4)
          torch.save({
              "config": {
                  "control": {"version": 4},
                  "resnet": {"num_blocks": 0, "conv_channels": 4},
              },
              "mortal": brain.state_dict(),
              "current_dqn": dqn.state_dict(),
          }, path)
          PY
      - if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} --extra dev
          jongbench selfcheck --runs-root "${{ runner.temp }}/selfcheck"
          --weights "${{ runner.temp }}/selfcheck-reviewer.pth"

  rust:
    name: Native Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Cargo tests (locked, native library features)
        run: >-
          PYO3_PYTHON="$(uv python find 3.12)"
          cargo test --locked --manifest-path libriichi/Cargo.toml --lib --no-default-features

  package:
    name: Root sdist + wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - run: >-
          uv build --python ${{ matrix.python-version }} --sdist --out-dir dist --clear
          --build-constraints build-constraints.txt --require-hashes
      - name: Build the wheel from the clean sdist
        run: >-
          uv build --python ${{ matrix.python-version }} --wheel dist/jongbench-*.tar.gz
          --out-dir dist --build-constraints build-constraints.txt --require-hashes
      - run: uvx --from twine==6.2.0 twine check dist/*
      - run: uv venv --python ${{ matrix.python-version }} wheel-venv
      - run: uv pip install --python wheel-venv/bin/python dist/*.whl
      - run: >-
          ${{ github.workspace }}/wheel-venv/bin/python -c
          'import importlib.util, sys; from pathlib import Path; import jongbench, libriichi;
          from jongbench import arena, bridge, engines, prompts, providers;
          assert Path(jongbench.__file__).is_relative_to(Path(sys.prefix));
          assert importlib.util.find_spec("torch") is None;
          assert importlib.util.find_spec("openai") is None;
          assert Path(jongbench.__file__).with_name("webui_page.html").is_file()'
        working-directory: ${{ runner.temp }}
      - run: ${{ github.workspace }}/wheel-venv/bin/jongbench --help
        working-directory: ${{ runner.temp }}
      - name: Torch-free gzip replay smoke
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p replay-smoke/logs
          ${{ github.workspace }}/wheel-venv/bin/python - <<'PY'
          import gzip
          import json

          events = [
              {"type": "start_game", "seed": [7, 1], "names": ["a", "b", "c", "d"]},
              {"type": "end_game"},
          ]
          with gzip.open("replay-smoke/logs/7_1.json.gz", "wt", encoding="utf-8") as handle:
              for event in events:
                  handle.write(json.dumps(event) + "\n")
          PY
          ${{ github.workspace }}/wheel-venv/bin/jongbench replay replay-smoke --out replay-smoke/replay.json
          ${{ github.workspace }}/wheel-venv/bin/python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          bundle = json.loads(Path("replay-smoke/replay.json").read_text())
          assert bundle["game"] == "7_1"
          assert len(bundle["frames"]) == 2
          assert len(bundle["frames"][0]["snapshot"]["seats"]) == 4
          assert importlib.util.find_spec("torch") is None
          PY

  hub-wheels:
    if: github.event_name == 'workflow_dispatch'
    name: Hub manylinux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cibuildwheel==4.2.0
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp312-manylinux_x86_64 cp313-manylinux_x86_64
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_COMMAND: >-
            python -c "from pathlib import Path; import jongbench, libriichi;
            assert Path(jongbench.__file__).with_name('webui_page.html').is_file()"
      - uses: actions/upload-artifact@v6
        with:
          name: jongbench-manylinux-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  environments:
    name: Environment packages / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Build the branch core used by the hanchan environment
        run: |
          uv build --python ${{ matrix.python-version }} --sdist --out-dir core-dist --clear \
            --build-constraints build-constraints.txt --require-hashes
          uv build --python ${{ matrix.python-version }} --wheel core-dist/jongbench-*.tar.gz \
            --out-dir core-dist --build-constraints build-constraints.txt --require-hashes
      - run: >-
          uv build --python ${{ matrix.python-version }} --sdist
          --out-dir decision-dist environments/riichi_decision_v1
          --build-constraints build-constraints.txt --require-hashes
      - run: >-
          uv build --python ${{ matrix.python-version }} --wheel decision-dist/*.tar.gz
          --out-dir decision-dist --build-constraints build-constraints.txt --require-hashes
      - run: >-
          uv build --python ${{ matrix.python-version }} --sdist
          --out-dir hanchan-dist environments/riichi_hanchan_v1
          --build-constraints build-constraints.txt --require-hashes
      - run: >-
          uv build --python ${{ matrix.python-version }} --wheel hanchan-dist/*.tar.gz
          --out-dir hanchan-dist --build-constraints build-constraints.txt --require-hashes
      - run: uvx --from twine==6.2.0 twine check decision-dist/* hanchan-dist/*
      - run: uv venv --python ${{ matrix.python-version }} decision-venv
      - run: uv pip install --python decision-venv/bin/python decision-dist/*.whl
      - run: ${{ github.workspace }}/decision-venv/bin/validate riichi_decision_v1 --runtime.type subprocess
        working-directory: ${{ runner.temp }}
      - run: uv venv --python ${{ matrix.python-version }} hanchan-venv
      - name: Install the hanchan wheel against this branch's core
        run: |
          uv pip install --python hanchan-venv/bin/python \
            core-dist/*.whl "torch>=2.4" "verifiers>=0.3.0,<0.4"
          uv pip install --python hanchan-venv/bin/python --no-deps hanchan-dist/*.whl
      - run: >-
          ${{ github.workspace }}/hanchan-venv/bin/python -c
          'import sys; from importlib.metadata import version; from pathlib import Path;
          import jongbench, torch;
          assert version("jongbench") == "0.1.1";
          assert Path(jongbench.__file__).is_relative_to(Path(sys.prefix))'
        working-directory: ${{ runner.temp }}
      - run: ${{ github.workspace }}/hanchan-venv/bin/validate riichi_hanchan_v1 --runtime.type subprocess -n 4
        working-directory: ${{ runner.temp }}

  gate:
    name: Release verification gate
    if: ${{ always() }}
    needs: [test, rust, package, environments]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ENVIRONMENTS_RESULT: ${{ needs.environments.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$ENVIRONMENTS_RESULT" = success
