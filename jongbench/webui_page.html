<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jongbench</title>
<style>
:root {
  color-scheme: light;
  --surface:#fcfcfb;
  --page:#f9f9f7;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --border:rgba(11,11,11,0.10);
  --accent:#2a78d6;
  --good:#0ca30c;
  --critical:#d03b3b;
  --man:#e34948;
  --pin:#2a78d6;
  --sou:#008300;
  --honor:#52514e;
  --aka:#d03b3b;
  --serious:#c98500;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface:#1a1a19;
    --page:#0d0d0d;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --muted:#898781;
    --grid:#2c2c2a;
    --border:rgba(255,255,255,0.10);
    --accent:#3987e5;
    --good:#0ca30c;
    --critical:#d03b3b;
    --man:#e66767;
    --pin:#3987e5;
    --sou:#1baf7a;
    --honor:#c3c2b7;
    --aka:#e66767;
    --serious:#eda100;
  }
}
html[data-theme="light"] {
  color-scheme: light;
  --surface:#fcfcfb;
  --page:#f9f9f7;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --border:rgba(11,11,11,0.10);
  --accent:#2a78d6;
  --good:#0ca30c;
  --critical:#d03b3b;
  --man:#e34948;
  --pin:#2a78d6;
  --sou:#008300;
  --honor:#52514e;
  --aka:#d03b3b;
  --serious:#c98500;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --surface:#1a1a19;
  --page:#0d0d0d;
  --ink:#ffffff;
  --ink-2:#c3c2b7;
  --muted:#898781;
  --grid:#2c2c2a;
  --border:rgba(255,255,255,0.10);
  --accent:#3987e5;
  --good:#0ca30c;
  --critical:#d03b3b;
  --man:#e66767;
  --pin:#3987e5;
  --sou:#1baf7a;
  --honor:#c3c2b7;
  --aka:#e66767;
  --serious:#eda100;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.4;
}
button, input, select, textarea { font: inherit; }
button, select { cursor: pointer; }
button {
  min-height: 36px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  padding: 7px 12px;
}
button.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
button:disabled { cursor: default; opacity: .55; }
input, select, textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  padding: 8px 9px;
}
label {
  display: grid;
  gap: 5px;
  min-width: 0;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 650;
}
pre {
  margin: 0;
  white-space: pre-wrap;
  color: var(--ink);
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px 16px 48px;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.brand {
  margin: 0;
  font-size: 28px;
  line-height: 1;
  letter-spacing: 0;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.panel {
  padding: 16px;
}
.start-grid {
  display: grid;
  gap: 12px;
}
.seat-row {
  display: grid;
  grid-template-columns: 80px 150px minmax(160px, 1fr) minmax(190px, 1.3fr);
  gap: 10px;
  align-items: end;
}
.seat-name {
  padding-bottom: 9px;
  color: var(--ink);
  font-weight: 760;
}
.keys-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.start-actions {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.seed-box {
  max-width: 220px;
}
.error {
  color: var(--critical);
  font-weight: 650;
}
.muted {
  color: var(--ink-2);
}
.banner {
  margin: 12px 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--ink-2);
  background: var(--surface);
}
.live-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.live-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--ink-2);
  font-size: 13px;
}
.viewer-select {
  width: auto;
  min-width: 160px;
}
.board {
  width: min(100%, 900px);
  aspect-ratio: 1;
  min-width: 0;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(144px, .78fr) minmax(300px, 1.25fr) minmax(144px, .78fr);
  grid-template-rows: minmax(144px, .78fr) minmax(300px, 1.25fr) minmax(144px, .78fr);
  gap: 8px;
}
.board-zone {
  min-width: 0;
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
}
.seat-zone {
  --tile-rotation: 0deg;
  display: grid;
  padding: 8px;
}
.seat-zone.bottom { grid-column: 2; grid-row: 3; --tile-rotation: 0deg; }
.seat-zone.top { grid-column: 2; grid-row: 1; --tile-rotation: 180deg; }
.seat-zone.left { grid-column: 1; grid-row: 2; --tile-rotation: -90deg; }
.seat-zone.right { grid-column: 3; grid-row: 2; --tile-rotation: 90deg; }
.center-zone {
  grid-column: 2;
  grid-row: 2;
  display: grid;
  place-items: center;
  padding: 10px;
}
.seat-content {
  min-width: 0;
  min-height: 0;
}
.top .seat-content, .bottom .seat-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.bottom .seat-head { margin-top: auto; }
.top .seat-melds { margin-top: auto; }
.seat-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  color: var(--ink);
  font-size: 12px;
  font-weight: 760;
}
.seat-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.score {
  font-variant-numeric: tabular-nums;
}
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  border-radius: 999px;
  border: 1px solid var(--border);
  padding: 2px 7px;
  font-size: 11px;
  font-weight: 760;
  color: var(--ink);
  background: var(--surface);
}
.chip.riichi { border-color: var(--accent); color: var(--accent); }
.chip.good { color: var(--good); }
.chip.serious { color: var(--serious); }
.chip.critical { color: var(--critical); }
.pond {
  display: grid;
  gap: 3px;
  min-height: 0;
}
.discard-row, .meld-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  min-width: 0;
  align-items: center;
}
.seat-hand {
  display: grid;
  grid-template-columns: repeat(14, minmax(0, 1fr));
  gap: 2px;
  min-width: 0;
  align-items: center;
}
.seat-hand .tile {
  width: 100%;
  height: auto;
  min-height: 0;
  aspect-ratio: .82;
}
.top .seat-hand { direction: rtl; }
.side .seat-content {
  height: 100%;
  display: grid;
  grid-template-columns: auto minmax(20px, .38fr) minmax(74px, 1.15fr);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 4px;
}
.side .seat-head {
  grid-column: 1 / -1;
  grid-row: 1;
}
.side .seat-hand, .side .seat-melds, .side .seat-pond {
  grid-row: 2;
  min-height: 0;
}
.left .seat-hand { grid-column: 1; }
.left .seat-melds { grid-column: 2; }
.left .seat-pond { grid-column: 3; }
.right .seat-pond { grid-column: 1; }
.right .seat-melds { grid-column: 2; }
.right .seat-hand { grid-column: 3; }
.side .seat-hand {
  width: 34px;
  height: 100%;
  grid-template-columns: 1fr;
  grid-template-rows: repeat(14, minmax(0, 1fr));
  gap: 1px;
  justify-self: center;
}
.side .seat-hand .tile {
  width: auto;
  height: 100%;
  max-width: 34px;
  aspect-ratio: 1.35;
  justify-self: center;
}
.side .pond {
  align-self: center;
  overflow: hidden;
}
.side .seat-melds {
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
.side .seat-melds .discard-row {
  flex-direction: column;
  align-items: center;
}
.tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 33px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  color: var(--ink);
  direction: ltr;
  padding: 0;
}
button.tile {
  cursor: pointer;
}
button.tile:hover:not(:disabled) {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
  transform: translateY(-2px);
}
button.tile:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.tile-glyph {
  display: block;
  font: 25px/1 "Noto Sans Mahjong", "Segoe UI Symbol", "Apple Symbols", sans-serif;
  transform: rotate(var(--tile-rotation));
}
.tile.m { color: var(--man); }
.tile.p { color: var(--pin); }
.tile.s { color: var(--sou); }
.tile.honor { color: var(--honor); }
.tile.aka { color: var(--aka); }
.tile.back {
  color: var(--muted);
  background: var(--grid);
}
.discard-called { opacity: .48; }
.discard-riichi { outline: 2px solid var(--accent); outline-offset: 1px; }
.human-controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
}
.human-controls button {
  min-height: 27px;
  padding: 4px 8px;
  font-size: 11px;
}
.human-hint {
  align-self: center;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
}
.wall {
  width: min(100%, 292px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  grid-template-rows: 34px minmax(0, 1fr) 34px;
  gap: 2px;
}
.wall-side {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 0;
  min-height: 0;
  gap: 0;
}
.wall-side.top { grid-column: 2; grid-row: 1; }
.wall-side.right { grid-column: 3; grid-row: 2; flex-direction: column; }
.wall-side.bottom { grid-column: 2; grid-row: 3; }
.wall-side.left { grid-column: 1; grid-row: 2; flex-direction: column; }
.wall-stack {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 28px;
  flex: 0 1 18px;
}
.wall-tile {
  position: absolute;
  color: var(--muted);
  font: 22px/1 "Noto Sans Mahjong", "Segoe UI Symbol", "Apple Symbols", sans-serif;
}
.wall-tile:first-child { transform: translate(-2px, -2px); }
.wall-tile:last-child { transform: translate(2px, 2px); }
.wall-side.left .wall-stack { transform: rotate(-90deg); }
.wall-side.right .wall-stack { transform: rotate(90deg); }
.wall-center {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
}
.center-card {
  width: min(100%, 260px);
  display: grid;
  gap: 9px;
  color: var(--ink-2);
  text-align: center;
  font-size: 13px;
}
.round-label {
  color: var(--ink);
  font-size: 18px;
  font-weight: 800;
}
.dora-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 36px;
}
.score-cross {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.score-mini {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ticker {
  width: min(100%, 900px);
  margin: 10px auto 0;
  display: grid;
  gap: 2px;
  color: var(--ink-2);
  font-size: 13px;
}
.final-grid, .review-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
}
.final-card, .review-card {
  padding: 12px;
}
.review-card.human {
  box-shadow: 0 0 0 2px var(--accent);
}
.hero-number {
  margin: 8px 0 2px;
  color: var(--ink);
  font-size: 36px;
  font-weight: 820;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.review-section {
  display: grid;
  gap: 12px;
  margin-top: 12px;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--grid);
  text-align: left;
  vertical-align: top;
}
th {
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 760;
}
.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.replay-controls {
  display: grid;
  grid-template-columns: auto 120px minmax(180px, 1fr) auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}
.pending-popup {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 10;
  width: min(360px, calc(100vw - 24px));
  max-height: min(60vh, 460px);
  transform: translate(-50%, -50%);
  display: grid;
  gap: 8px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
}
.pending-popup[hidden] { display: none; }
.pending-actions {
  display: grid;
  gap: 7px;
}
.pending-actions button {
  min-height: 40px;
}
[hidden] { display: none !important; }
@media (max-width: 900px) {
  .page { padding: 14px 10px 42px; }
  .seat-row {
    grid-template-columns: 72px minmax(120px, 1fr);
  }
  .seat-row label:nth-child(3), .seat-row label:nth-child(4) {
    grid-column: 2;
  }
  .board {
    width: 100%;
    grid-template-columns: minmax(82px, .62fr) minmax(230px, 1.4fr) minmax(82px, .62fr);
    grid-template-rows: minmax(114px, .7fr) minmax(250px, 1.4fr) minmax(114px, .7fr);
    gap: 5px;
  }
  .seat-zone { padding: 5px; }
  .tile {
    width: 24px;
    height: 29px;
  }
  .tile-glyph { font-size: 21px; }
  .side .seat-content { grid-template-columns: auto minmax(14px, .3fr) minmax(54px, 1fr); }
  .side .seat-hand { width: 28px; }
  .side .seat-hand .tile { max-width: 28px; }
  .wall { width: min(100%, 244px); grid-template-columns: 29px minmax(0, 1fr) 29px; grid-template-rows: 29px minmax(0, 1fr) 29px; }
  .wall-stack { width: 15px; height: 23px; flex-basis: 15px; }
  .wall-tile { font-size: 18px; }
  .center-card { font-size: 11px; gap: 5px; }
  .round-label { font-size: 15px; }
  .score-mini { padding: 3px; font-size: 10px; }
  .replay-controls {
    grid-template-columns: 1fr 1fr;
  }
  .replay-controls input {
    grid-column: 1 / -1;
  }
}
@media (max-width: 580px) {
  .board {
    grid-template-columns: minmax(58px, .55fr) minmax(184px, 1.45fr) minmax(58px, .55fr);
    grid-template-rows: minmax(104px, .68fr) minmax(245px, 1.3fr) minmax(104px, .68fr);
  }
  .seat-head { font-size: 10px; gap: 3px; }
  .chip { min-height: 17px; padding: 1px 4px; font-size: 9px; }
  .side .seat-content { grid-template-columns: auto minmax(8px, .15fr) minmax(36px, 1fr); gap: 2px; }
  .side .seat-hand { width: 22px; }
  .side .seat-hand .tile { max-width: 22px; }
  .side .tile { width: 17px; height: 14px; }
  .side .tile-glyph { font-size: 15px; }
  .discard-row, .meld-row { gap: 1px; }
  .wall { width: min(100%, 205px); grid-template-columns: 24px minmax(0, 1fr) 24px; grid-template-rows: 24px minmax(0, 1fr) 24px; }
  .wall-stack { width: 12px; height: 19px; flex-basis: 12px; }
  .wall-tile { font-size: 15px; }
  .dora-row .tile { width: 20px; height: 24px; }
  .dora-row .tile-glyph { font-size: 17px; }
  .score-cross { gap: 2px; }
  .score-mini { padding: 2px; font-size: 8px; }
  .pending-popup { top: 42%; }
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <h1 class="brand">jongbench</h1>
    <div class="toolbar">
      <button id="nav-start" type="button">start</button>
      <button id="theme-toggle" type="button" aria-pressed="false">theme</button>
    </div>
  </div>
  <section id="app"></section>
</main>
<section id="pending-sheet" class="pending-popup" hidden></section>
<script>
const app = document.getElementById("app");
const pendingSheet = document.getElementById("pending-sheet");
const seatNames = ["East", "South", "West", "North"];
const providers = ["anthropic", "openai", "google", "xai", "deepseek", "compat", "random", "human"];
const defaultModels = {anthropic: "claude-sonnet-4-5", openai: "gpt-4.1", google: "gemini-2.5-pro", xai: "grok-4", deepseek: "deepseek-chat", compat: ""};
const mahjongGlyphs = {
  E: "\u{1F000}", S: "\u{1F001}", W: "\u{1F002}", N: "\u{1F003}",
  C: "\u{1F004}", F: "\u{1F005}", P: "\u{1F006}",
};
for (let number = 1; number <= 9; number++) {
  mahjongGlyphs[`${number}m`] = String.fromCodePoint(0x1F006 + number);
  mahjongGlyphs[`${number}s`] = String.fromCodePoint(0x1F00F + number);
  mahjongGlyphs[`${number}p`] = String.fromCodePoint(0x1F018 + number);
}
let startSeats = Array.from({length: 4}, () => ({provider: "random", model: "", baseUrl: ""}));
let live = null;
let replay = null;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = String(value);
    else if (key === "text") node.textContent = String(value);
    else if (key === "htmlFor") node.htmlFor = String(value);
    else if (key === "checked") node.checked = Boolean(value);
    else if (key === "value") node.value = String(value);
    else if (key === "hidden") node.hidden = Boolean(value);
    else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, String(value));
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function clear(node, ...children) {
  node.replaceChildren(...children);
}

function fmtTile(tile) {
  const text = String(tile || "?");
  if (text === "?") return "?";
  if (text === "5mr") return "0m";
  if (text === "5pr") return "0p";
  if (text === "5sr") return "0s";
  return text;
}

function rawTile(tile) {
  const text = String(tile || "?");
  if (text === "0m") return "5mr";
  if (text === "0p") return "5pr";
  if (text === "0s") return "5sr";
  return text;
}

function tileGlyph(tile) {
  const raw = rawTile(tile);
  if (raw === "?") return "\u{1F02B}";
  const base = raw.endsWith("r") ? raw.slice(0, -1) : raw;
  return mahjongGlyphs[base] || "\u{1F02B}";
}

function tileClass(tile) {
  const text = fmtTile(tile);
  if (text === "?") return "back";
  if (/^[0-9]m$/.test(text)) return `m${text[0] === "0" ? " aka" : ""}`;
  if (/^[0-9]p$/.test(text)) return `p${text[0] === "0" ? " aka" : ""}`;
  if (/^[0-9]s$/.test(text)) return `s${text[0] === "0" ? " aka" : ""}`;
  return "honor";
}

function tileSpan(tile, options) {
  const config = options || {};
  const shown = fmtTile(tile);
  const interactive = typeof config.onclick === "function";
  const label = shown === "?" ? "face-down tile" : shown;
  const attrs = {
    class: `tile ${tileClass(tile)}${interactive ? " tile-choice" : ""}${config.className ? ` ${config.className}` : ""}`,
    title: label,
    "aria-label": config.ariaLabel || label,
  };
  if (interactive) {
    attrs.type = "button";
    attrs.disabled = Boolean(config.disabled);
    attrs.onclick = config.onclick;
  }
  return el(interactive ? "button" : "span", attrs, el("span", {class: "tile-glyph", text: tileGlyph(tile)}));
}

function tileLine(tiles, className) {
  const line = el("div", {class: className || "hand-row"});
  const inner = el("div", {class: "tile-line-inner discard-row"});
  for (const tile of tiles || []) inner.append(tileSpan(tile));
  line.append(inner);
  return line;
}

function discardTiles(discards, side) {
  const wrap = el("div", {class: "pond"});
  const visible = side ? (discards || []).slice(0, 12) : (discards || []);
  for (let i = 0; i < visible.length; i += 6) {
    const row = el("div", {class: "discard-row tile-line-inner"});
    for (const discard of visible.slice(i, i + 6)) {
      const tile = tileSpan(discard.tile || "?");
      if (discard.called) tile.classList.add("discard-called");
      if (discard.riichi) tile.classList.add("discard-riichi");
      row.append(tile);
    }
    wrap.append(row);
  }
  if (side && (discards || []).length > 12) {
    wrap.append(el("span", {class: "chip", text: `+${(discards || []).length - 12}`}));
  }
  return wrap;
}

function meldRow(melds) {
  const row = el("div", {class: "meld-row"});
  for (const meld of melds || []) {
    const group = el("span", {class: "discard-row"});
    for (const tile of meld.tiles || []) group.append(tileSpan(tile));
    row.append(group);
  }
  return row;
}

function orderedSeat(viewerSeat, offset) {
  return (Number(viewerSeat || 0) + offset) % 4;
}

function renderBoard(snapshot, viewerSeat, names) {
  if (!snapshot) return el("div", {class: "banner", text: "Waiting for table state"});
  const board = el("div", {class: "board"});
  const seats = snapshot.seats || [0, 1, 2, 3].map(seat => ({
    seat,
    name: (names || snapshot.names || [])[seat] || `P${seat}`,
    wind: "?",
    score: (snapshot.scores || [])[seat] || 0,
    hand: (snapshot.hands || [])[seat] || [],
    melds: (snapshot.melds || [])[seat] || [],
    discards: (snapshot.discards || [])[seat] || [],
    riichi_declared: (snapshot.riichi_declared || [])[seat],
    riichi_accepted: (snapshot.riichi_accepted || [])[seat],
  }));
  const bySeat = new Map(seats.map(seat => [Number(seat.seat), seat]));
  board.append(renderSeat(bySeat.get(orderedSeat(viewerSeat, 2)), "top", live && live.pending));
  board.append(renderSeat(bySeat.get(orderedSeat(viewerSeat, 3)), "left side", live && live.pending));
  board.append(renderCenter(snapshot, viewerSeat, names));
  board.append(renderSeat(bySeat.get(orderedSeat(viewerSeat, 1)), "right side", live && live.pending));
  board.append(renderSeat(bySeat.get(orderedSeat(viewerSeat, 0)), "bottom", live && live.pending));
  return board;
}

function renderSeat(seat, position, pending) {
  const zone = el("div", {class: `board-zone seat-zone ${position}`});
  if (!seat) return zone;
  const content = el("div", {class: "seat-content"});
  const title = `${seat.wind || "?"} P${seat.seat} ${seat.name || ""}`;
  const head = el("div", {class: "seat-head"},
    el("span", {class: "seat-title", text: title}),
    el("span", {class: "score", text: String(seat.score ?? 0)})
  );
  if (seat.riichi_declared || seat.riichi_accepted) head.append(el("span", {class: "chip riichi", text: "RIICHI"}));
  const isHuman = position === "bottom" && pending && Number(pending.seat) === Number(seat.seat);
  const hand = el("div", {class: "seat-hand"});
  const handTiles = position.includes("right") ? [...(seat.hand || [])].reverse() : (seat.hand || []);
  for (const tile of handTiles) {
    const option = isHuman ? discardOptionForTile(pending, tile) : null;
    hand.append(tileSpan(tile, option ? {
      ariaLabel: `Discard ${fmtTile(tile)}`,
      disabled: Boolean(live && live.submitting),
      onclick: () => choosePending(pending.generation, option.choice),
    } : undefined));
  }
  const pond = discardTiles(seat.discards, position.includes("side"));
  pond.classList.add("seat-pond");
  const melds = meldRow(seat.melds);
  melds.classList.add("seat-melds");
  const controls = isHuman ? renderHumanControls(pending) : null;
  if (position === "bottom") {
    content.append(pond, melds, head);
    if (controls) content.append(controls);
    content.append(hand);
  } else if (position === "top") {
    content.append(hand, head, melds, pond);
  } else {
    content.append(head, hand, melds, pond);
  }
  zone.append(content);
  return zone;
}

function pendingOptions(pending) {
  return (pending && pending.options || []).filter(option => option && Number.isInteger(Number(option.choice)));
}

function discardOptionForTile(pending, tile) {
  const raw = rawTile(tile);
  return pendingOptions(pending).find(option => option.action === "discard" && option.tile === raw) || null;
}

function renderHumanControls(pending) {
  const controls = el("div", {class: "human-controls"});
  const options = pendingOptions(pending);
  if (options.some(option => option.action === "discard")) {
    controls.append(el("span", {class: "human-hint", text: "Choose a tile to discard"}));
  }
  const popupActions = new Set(["chi", "pon", "ron", "tsumo"]);
  for (const option of options) {
    if (option.action === "discard" || popupActions.has(option.action)) continue;
    controls.append(el("button", {
      type: "button",
      disabled: Boolean(live && live.submitting),
      onclick: () => choosePending(pending.generation, option.choice),
      text: option.label,
    }));
  }
  return controls;
}

function renderCenter(snapshot, viewerSeat, names) {
  const zone = el("div", {class: "board-zone center-zone"});
  const wall = renderWall(snapshot.tiles_left);
  const center = el("div", {class: "wall-center"});
  const card = el("div", {class: "center-card"});
  const round = `${roundName(snapshot.bakaze)} ${snapshot.kyoku || 1} · honba ${snapshot.honba || 0}`;
  card.append(el("div", {class: "round-label", text: round}));
  card.append(el("div", {text: `kyotaku ${snapshot.kyotaku || 0} · tiles left ${snapshot.tiles_left ?? 0}`}));
  const dora = el("div", {class: "dora-row"}, el("span", {class: "muted", text: "dora"}));
  for (const tile of snapshot.dora_indicators || []) dora.append(tileSpan(tile));
  card.append(dora);
  const cross = el("div", {class: "score-cross"});
  for (let offset = 0; offset < 4; offset++) {
    const seat = orderedSeat(viewerSeat, offset);
    const name = (names || snapshot.names || [])[seat] || `P${seat}`;
    const score = (snapshot.scores || [])[seat] ?? 0;
    cross.append(el("div", {class: "score-mini", text: `${name}: ${score}`}));
  }
  card.append(cross);
  center.append(card);
  wall.append(center);
  zone.append(wall);
  return zone;
}

function renderWall(tilesLeft) {
  const wall = el("div", {class: "wall"});
  const stacks = Math.ceil(Math.max(0, Number(tilesLeft) || 0) / 2);
  let remaining = stacks;
  for (const side of ["top", "right", "bottom", "left"]) {
    const sidesLeft = 4 - ["top", "right", "bottom", "left"].indexOf(side);
    const count = Math.ceil(remaining / sidesLeft);
    remaining -= count;
    const segment = el("div", {class: `wall-side ${side}`});
    for (let stack = 0; stack < count; stack++) {
      segment.append(el("span", {class: "wall-stack", "aria-label": "wall tiles"},
        el("span", {class: "wall-tile", text: "\u{1F02B}"}),
        el("span", {class: "wall-tile", text: "\u{1F02B}"})
      ));
    }
    wall.append(segment);
  }
  return wall;
}

function roundName(wind) {
  return ({E: "East", S: "South", W: "West", N: "North"})[wind] || String(wind || "East");
}

function renderTicker(snapshot) {
  const ticker = el("div", {class: "ticker"});
  for (const line of (snapshot && snapshot.ticker || []).slice(-8)) {
    ticker.append(el("div", {text: displayTileText(line)}));
  }
  return ticker;
}

function displayTileText(text) {
  return String(text || "").replace(/\b(0[mps]|[1-9][mps]|[ESWNPFC])\b/g, match => tileGlyph(match));
}

function renderStart() {
  stopLive();
  pendingSheet.hidden = true;
  const form = el("form", {class: "card panel start-grid", onsubmit: submitStart});
  for (let seat = 0; seat < 4; seat++) form.append(renderSeatRow(seat));
  const keys = el("div", {class: "keys-grid", id: "keys-grid"});
  const seed = el("label", {class: "seed-box"}, "Seed", el("input", {id: "seed", type: "number", inputmode: "numeric", placeholder: "random"}));
  const label = el("label", {class: "seed-box"}, "Label", el("input", {id: "label", type: "text", placeholder: "optional"}));
  const error = el("div", {id: "start-error", class: "error"});
  const actions = el("div", {class: "start-actions"},
    el("div", {class: "toolbar"}, seed, label),
    el("div", {class: "toolbar"},
      el("button", {id: "demo-button", type: "button", hidden: true, onclick: () => { location.hash = "#replay"; }}, "watch demo"),
      el("button", {class: "primary", type: "submit"}, "start")
    )
  );
  form.append(keys, actions, error);
  clear(app, form);
  updateKeyInputs();
  probeDemo();
}

function renderSeatRow(seat) {
  const state = startSeats[seat];
  const row = el("div", {class: "seat-row"});
  row.append(el("div", {class: "seat-name", text: seatNames[seat]}));
  const providerSelect = el("select", {onchange: event => {
    state.provider = event.target.value;
    if (!state.model && defaultModels[state.provider]) state.model = defaultModels[state.provider];
    renderStart();
  }});
  for (const provider of providers) providerSelect.append(el("option", {value: provider, text: provider}));
  providerSelect.value = state.provider;
  row.append(el("label", {}, "Provider", providerSelect));
  const modelInput = el("input", {type: "text", value: state.model || defaultModels[state.provider] || "", placeholder: "model", oninput: event => { state.model = event.target.value; }});
  row.append(el("label", {hidden: state.provider === "random" || state.provider === "human"}, "Model", modelInput));
  const baseInput = el("input", {type: "url", value: state.baseUrl || "", placeholder: "https://example.com/v1", oninput: event => { state.baseUrl = event.target.value; }});
  row.append(el("label", {hidden: state.provider !== "compat"}, "Base URL", baseInput));
  return row;
}

function updateKeyInputs() {
  const keysGrid = document.getElementById("keys-grid");
  if (!keysGrid) return;
  const used = [...new Set(startSeats.map(seat => seat.provider).filter(provider => !["random", "human"].includes(provider)))];
  const fields = used.map(provider => el("label", {},
    `${provider.toUpperCase()} API key — sent only to this server for this game, never stored`,
    el("input", {type: "password", autocomplete: "off", datasetProvider: provider, "data-provider": provider})
  ));
  clear(keysGrid, ...fields);
}

async function submitStart(event) {
  event.preventDefault();
  const error = document.getElementById("start-error");
  if (error) error.textContent = "";
  const models = startSeats.map(seat => specString(seat));
  const humanSeats = startSeats.map((seat, idx) => seat.provider === "human" ? idx : null).filter(value => value !== null);
  const keys = {};
  for (const input of document.querySelectorAll("[data-provider]")) {
    if (input.value) keys[input.getAttribute("data-provider")] = input.value;
  }
  const seedInput = document.getElementById("seed");
  const labelInput = document.getElementById("label");
  try {
    const response = await fetch("/api/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      cache: "no-store",
      body: JSON.stringify({
        models,
        keys,
        seed: seedInput && seedInput.value ? Number(seedInput.value) : null,
        human_seat: humanSeats.length ? humanSeats[0] : null,
        label: labelInput && labelInput.value ? labelInput.value : null,
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "failed to start");
    location.hash = `#run=${data.run_id}`;
  } catch (exc) {
    if (error) error.textContent = exc.message || String(exc);
  }
}

function specString(seat) {
  if (seat.provider === "random" || seat.provider === "human") return seat.provider;
  if (seat.provider === "compat") return `compat:${seat.baseUrl || ""}:${seat.model || ""}`;
  return `${seat.provider}:${seat.model || defaultModels[seat.provider] || ""}`;
}

async function probeDemo() {
  try {
    const response = await fetch("/api/demo", {cache: "no-store"});
    const button = document.getElementById("demo-button");
    if (button) button.hidden = !response.ok;
  } catch (_) {
    const button = document.getElementById("demo-button");
    if (button) button.hidden = true;
  }
}

async function showRun(runId) {
  stopLive();
  const shell = el("section", {});
  clear(app, shell);
  live = {runId, lastSeq: 0, retries: 0, state: null, snapshot: null, viewerSeat: 0, source: null, pending: null, pendingGeneration: null, pendingError: null, submitting: false, stateTimer: null, pendingTimer: null};
  await refreshState();
  if (!live) return;
  live.viewerSeat = live.state && live.state.human_seat !== null ? live.state.human_seat : 0;
  renderLive();
  connectSse();
  live.stateTimer = setInterval(refreshState, 1800);
  if (live.state && live.state.human_seat !== null) {
    live.pendingTimer = setInterval(pollPending, 700);
    pollPending();
  }
}

async function refreshState() {
  if (!live) return;
  const response = await fetch(`/api/state/${encodeURIComponent(live.runId)}`, {cache: "no-store"});
  const state = await response.json();
  if (!response.ok) throw new Error(state.error || "failed to load state");
  live.state = state;
  if (state.human_seat !== null) live.viewerSeat = state.human_seat;
  renderLive();
}

function renderLive() {
  if (!live || !live.state) return;
  const state = live.state;
  const head = el("div", {class: "live-head"});
  head.append(el("div", {class: "live-meta"},
    el("span", {class: "chip", text: state.status}),
    el("span", {text: `latest #${state.latest_seq || 0}`})
  ));
  if (state.human_seat === null) {
    const select = el("select", {class: "viewer-select", onchange: event => {
      live.viewerSeat = Number(event.target.value);
      renderLive();
    }});
    for (let seat = 0; seat < 4; seat++) select.append(el("option", {value: seat, text: `view P${seat} ${state.names[seat] || ""}`}));
    select.value = String(live.viewerSeat);
    head.append(select);
  }
  const children = [head];
  if (state.status === "evaluating") children.push(el("div", {class: "banner", text: "Mortal is reviewing the game…"}));
  if (state.status === "error") children.push(el("div", {class: "banner error", text: state.error || "error"}));
  children.push(renderBoard(live.snapshot, live.viewerSeat, state.names));
  children.push(renderTicker(live.snapshot));
  if (state.final) children.push(renderFinal(state.final, state.names));
  clear(app, ...children);
  if (live.pending) renderPending(live.pending);
  else pendingSheet.hidden = true;
}

function renderFinal(final, names) {
  const wrap = el("section", {class: "card panel review-section"});
  wrap.append(el("h2", {text: "Final placements"}));
  const grid = el("div", {class: "final-grid"});
  for (let seat = 0; seat < 4; seat++) {
    const name = (final.names || names || [])[seat] || `P${seat}`;
    grid.append(el("div", {class: "card final-card"},
      el("strong", {text: name}),
      el("div", {class: "hero-number", text: ordinal((final.placements || {})[name] || seat + 1)}),
      el("div", {class: "muted", text: `${(final.scores || [])[seat] ?? 0} points`})
    ));
  }
  wrap.append(grid, el("button", {type: "button", onclick: () => showReview(live.runId)}, "view review"));
  return wrap;
}

function connectSse() {
  if (!live) return;
  if (live.source) live.source.close();
  const source = new EventSource(`/api/events/${encodeURIComponent(live.runId)}?since=${live.lastSeq}`);
  live.source = source;
  source.addEventListener("frame", event => {
    const frame = JSON.parse(event.data);
    live.lastSeq = Math.max(live.lastSeq, Number(frame.seq || 0));
    live.snapshot = frame.snapshot;
    renderLive();
    if (live.state && live.state.human_seat !== null) pollPending();
  });
  source.addEventListener("status", event => {
    live.state = JSON.parse(event.data);
    renderLive();
    source.close();
  });
  source.onerror = () => {
    source.close();
    if (!live || (live.state && ["done", "error"].includes(live.state.status))) return;
    live.retries += 1;
    if (live.retries <= 5) setTimeout(connectSse, 500 * live.retries);
    else clear(app, el("div", {class: "banner error", text: "SSE connection failed"}));
  };
}

async function pollPending() {
  if (!live || !live.state || live.state.human_seat === null) return;
  if (!["starting", "running"].includes(live.state.status)) {
    live.pending = null;
    live.pendingGeneration = null;
    live.submitting = false;
    pendingSheet.hidden = true;
    return;
  }
  try {
    const response = await fetch(`/api/pending/${encodeURIComponent(live.runId)}`, {cache: "no-store"});
    const pending = await response.json();
    if (!pending) {
      if (live.pending || live.pendingGeneration !== null) {
        live.pending = null;
        live.pendingGeneration = null;
        live.pendingError = null;
        live.submitting = false;
        renderLive();
      }
      return;
    }
    if (pending.generation !== live.pendingGeneration) {
      live.pending = pending;
      live.pendingGeneration = pending.generation;
      live.pendingError = null;
      live.submitting = false;
      renderLive();
    }
  } catch (_) {
  }
}

function renderPending(pending) {
  const popupActions = new Set(["chi", "pon", "ron", "tsumo"]);
  const choices = pendingOptions(pending).filter(option => popupActions.has(option.action));
  if (!choices.length) {
    pendingSheet.hidden = true;
    return;
  }
  const actions = el("div", {class: "pending-actions"});
  for (const option of choices) {
    actions.append(el("button", {
      type: "button",
      disabled: Boolean(live && live.submitting),
      onclick: () => choosePending(pending.generation, option.choice),
      text: option.label,
    }));
  }
  const pass = pendingOptions(pending).find(option => option.action === "pass");
  if (pass) {
    actions.append(el("button", {
      type: "button",
      disabled: Boolean(live && live.submitting),
      onclick: () => choosePending(pending.generation, pass.choice),
      text: "pass",
    }));
  }
  const title = choices.some(option => option.action === "ron" || option.action === "tsumo") ? "Win or continue" : "Call";
  const children = [el("strong", {text: title})];
  if (live && live.pendingError) children.push(el("div", {class: "error", text: live.pendingError}));
  children.push(actions);
  clear(pendingSheet, ...children);
  pendingSheet.hidden = false;
}

async function choosePending(generation, choice) {
  if (!live || live.submitting) return;
  live.submitting = true;
  live.pendingError = null;
  renderLive();
  try {
    const response = await fetch(`/api/choose/${encodeURIComponent(live.runId)}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      cache: "no-store",
      body: JSON.stringify({generation, choice}),
    });
    const data = await response.json();
    if (response.ok && data.ok) {
      live.pending = null;
      live.pendingGeneration = null;
      pendingSheet.hidden = true;
      return;
    }
    live.pendingError = data.error || "That choice is no longer available.";
  } catch (exc) {
    live.pendingError = exc.message || "Could not send that choice.";
  }
  live.submitting = false;
  renderLive();
}

async function showReview(runId) {
  if (live && live.stateTimer) {
    clearInterval(live.stateTimer);
    live.stateTimer = null;
  }
  const target = el("section", {class: "card panel review-section"}, el("h2", {text: "Review"}), el("div", {class: "muted", text: "Loading"}));
  app.append(target);
  try {
    const response = await fetch(`/api/review/${encodeURIComponent(runId)}`, {cache: "no-store"});
    const review = await response.json();
    if (!response.ok) throw new Error(review.error || "review unavailable");
    renderReview(review, live && live.state ? live.state.names : review.names, live && live.state ? live.state.human_seat : null, target);
  } catch (exc) {
    clear(target, el("h2", {text: "Review"}), el("div", {class: "error", text: exc.message || String(exc)}));
  }
}

function renderReview(review, names, humanSeat, target) {
  const players = review.players || {};
  const grid = el("div", {class: "review-grid"});
  for (let seat = 0; seat < 4; seat++) {
    const player = players[String(seat)] || players[seat] || {};
    const rv = player.review || {};
    const aggregates = player.aggregates || {};
    const total = Number(rv.total_reviewed || player.total_reviewed || 0);
    const matches = Number(rv.total_matches || 0);
    const matchRate = aggregates.match_rate !== undefined ? Number(aggregates.match_rate) : (total ? matches / total : 0);
    grid.append(el("div", {class: `card review-card${seat === humanSeat ? " human" : ""}`},
      el("strong", {text: player.name || (names || [])[seat] || `P${seat}`}),
      el("div", {class: "hero-number", text: (Number(rv.rating || 0) * 100).toFixed(1)}),
      el("div", {class: "muted", text: `${pct(matchRate)} match · ${total} reviewed`})
    ));
  }
  const sections = [el("h2", {text: "Review"}), grid];
  for (let seat = 0; seat < 4; seat++) {
    const player = players[String(seat)] || players[seat] || {};
    sections.push(renderSeatReview(seat, player, (names || [])[seat] || `P${seat}`));
  }
  sections.push(el("div", {class: "muted", text: `full report: ${review.report_path || review.run_dir || "not available"}`}));
  clear(target, ...sections);
}

function renderSeatReview(seat, player, name) {
  const section = el("section", {class: "card panel review-section"});
  section.append(el("h3", {text: `${name} worst decisions`}));
  const worstTable = el("table", {});
  worstTable.append(row("tr", ["Kyoku", "Actual", "Expected", "Loss"], "th"));
  for (const item of ((player.aggregates || {}).worst || [])) {
    const tr = el("tr", {});
    tr.append(el("td", {text: `${item.kyoku ?? 0}/${item.junme ?? 0}`}));
    const actual = el("td", {});
    appendFormattedText(actual, eventLabel(item.actual || {}));
    const expected = el("td", {});
    appendFormattedText(expected, eventLabel(item.expected || {}));
    tr.append(actual, expected, el("td", {class: "num"}, lossChip(Number(item.loss || 0))));
    worstTable.append(tr);
  }
  const kindTable = el("table", {});
  kindTable.append(row("tr", ["Kind", "Count", "Match", "Mean loss"], "th"));
  const byKind = (player.aggregates || {}).by_kind || {};
  for (const kind of Object.keys(byKind).sort()) {
    const stats = byKind[kind] || {};
    const count = Number(stats.count || 0);
    const matches = Number(stats.matches || 0);
    kindTable.append(row("tr", [kind, count, count ? pct(matches / count) : "0%", pct(Number(stats.mean_loss || 0))], "td"));
  }
  section.append(el("div", {class: "table-wrap"}, worstTable), el("h3", {text: "By kind"}), el("div", {class: "table-wrap"}, kindTable));
  return section;
}

function row(tag, values, cellTag) {
  const tr = el(tag, {});
  for (const value of values) tr.append(el(cellTag, {text: value}));
  return tr;
}

function lossChip(loss) {
  const cls = loss >= 0.5 ? "critical" : loss >= 0.25 ? "serious" : "";
  return el("span", {class: `chip ${cls}`, text: `-${Math.round(loss * 100)}%`});
}

function eventLabel(event) {
  const type = event.type || "none";
  if (type === "dahai") return `discard ${fmtTile(event.pai)}${event.tsumogiri ? " drawn" : ""}`;
  if (type === "reach") return "riichi";
  if (type === "hora") return "win";
  if (type === "chi" || type === "pon" || type === "daiminkan") return `${type} ${fmtTile(event.pai)} ${(event.consumed || []).map(fmtTile).join(" ")}`;
  if (type === "ankan") return `ankan ${(event.consumed || []).map(fmtTile).join(" ")}`;
  if (type === "kakan") return `kakan ${fmtTile(event.pai)}`;
  if (type === "ryukyoku") return "abortive draw";
  return type;
}

function appendFormattedText(parent, text) {
  const pattern = /(0[mps]|[1-9][mps]|[ESWNPFC])/g;
  let last = 0;
  for (const match of String(text).matchAll(pattern)) {
    if (match.index > last) parent.append(document.createTextNode(String(text).slice(last, match.index)));
    parent.append(tileSpan(match[1]));
    last = match.index + match[1].length;
  }
  if (last < String(text).length) parent.append(document.createTextNode(String(text).slice(last)));
}

function showReplay() {
  stopLive();
  pendingSheet.hidden = true;
  replay = {bundle: null, index: 0, playing: false, timer: null, speed: 1};
  renderReplayShell();
  loadDemoBundle();
}

function renderReplayShell() {
  const file = el("input", {type: "file", accept: "application/json", onchange: loadReplayFile});
  clear(app, el("section", {class: "card panel review-section"},
    el("div", {class: "replay-controls", id: "replay-controls"}),
    el("div", {id: "replay-board", class: "review-section"}),
    el("label", {}, "Open demo.json", file)
  ));
  renderReplay();
}

async function loadDemoBundle() {
  try {
    const response = await fetch("/api/demo", {cache: "no-store"});
    if (!response.ok) return;
    replay.bundle = await response.json();
    replay.index = 0;
    renderReplay();
  } catch (_) {
  }
}

function loadReplayFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    replay.bundle = JSON.parse(String(reader.result || "{}"));
    replay.index = 0;
    renderReplay();
  };
  reader.readAsText(file);
}

function renderReplay() {
  if (!replay) return;
  const controls = document.getElementById("replay-controls");
  const board = document.getElementById("replay-board");
  if (!controls || !board) return;
  const frames = replay.bundle ? replay.bundle.frames || [] : [];
  const max = Math.max(0, frames.length - 1);
  replay.index = Math.min(replay.index, max);
  const play = el("button", {type: "button", onclick: toggleReplay, text: replay.playing ? "pause" : "play"});
  const speed = el("select", {onchange: event => {
    replay.speed = Number(event.target.value);
    if (replay.playing) startReplayTimer();
  }});
  for (const value of [0.5, 1, 2, 4, 8]) speed.append(el("option", {value, text: `${value}×`}));
  speed.value = String(replay.speed);
  const slider = el("input", {type: "range", min: 0, max, value: replay.index, oninput: event => {
    replay.index = Number(event.target.value);
    replay.playing = false;
    stopReplayTimer();
    renderReplay();
  }});
  clear(controls, play, speed, slider, el("span", {class: "muted", text: frames.length ? `${replay.index + 1}/${frames.length}` : "no demo loaded"}));
  const children = [];
  if (frames.length) {
    const frame = frames[replay.index];
    const names = (replay.bundle.config && replay.bundle.config.names) || (replay.bundle.final && replay.bundle.final.names) || [];
    children.push(renderBoard(frame.snapshot, 0, names), renderTicker(frame.snapshot));
    if (replay.index === max && replay.bundle.review) {
      const target = el("section", {class: "card panel review-section"});
      renderReview(replay.bundle.review, names, null, target);
      children.push(target);
    }
  } else {
    children.push(el("div", {class: "banner", text: "Load a demo bundle"}));
  }
  clear(board, ...children);
}

function toggleReplay() {
  replay.playing = !replay.playing;
  if (replay.playing) startReplayTimer();
  else stopReplayTimer();
  renderReplay();
}

function startReplayTimer() {
  stopReplayTimer();
  replay.timer = setInterval(() => {
    const frames = replay.bundle ? replay.bundle.frames || [] : [];
    if (!frames.length || replay.index >= frames.length - 1) {
      replay.playing = false;
      stopReplayTimer();
    } else {
      replay.index += 1;
    }
    renderReplay();
  }, Math.max(60, 650 / replay.speed));
}

function stopReplayTimer() {
  if (replay && replay.timer) clearInterval(replay.timer);
  if (replay) replay.timer = null;
}

function stopLive() {
  if (!live) return;
  if (live.source) live.source.close();
  if (live.stateTimer) clearInterval(live.stateTimer);
  if (live.pendingTimer) clearInterval(live.pendingTimer);
  live = null;
}

function ordinal(value) {
  const n = Number(value || 0);
  const mod = n % 100;
  const suffix = mod >= 11 && mod <= 13 ? "th" : ({1: "st", 2: "nd", 3: "rd"}[n % 10] || "th");
  return `${n}${suffix}`;
}

function pct(value) {
  return `${Math.round(Number(value || 0) * 100)}%`;
}

function route() {
  const hash = location.hash || "#start";
  if (hash.startsWith("#run=")) showRun(hash.slice(5));
  else if (hash === "#replay") showReplay();
  else renderStart();
}

document.getElementById("nav-start").addEventListener("click", () => { location.hash = "#start"; });
document.getElementById("theme-toggle").addEventListener("click", event => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : current === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  event.currentTarget.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
});
window.addEventListener("hashchange", route);
route();
</script>
