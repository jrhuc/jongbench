[project]
name = "riichi-hanchan-v1"
version = "0.1.0rc2"
description = "Four models play a full riichi mahjong hanchan against each other"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
tags = ["riichi", "mahjong", "multi-agent", "long-horizon", "eval", "v1"]
dependencies = [
    "verifiers>=0.3.0,<0.4",
    "jongbench @ git+https://github.com/jrhuc/jongbench.git@cf4c835dcc176c654c7c8e551c4c2e4b7ac86f69",
]

[project.urls]
Repository = "https://github.com/jrhuc/jongbench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["riichi_hanchan_v1"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
