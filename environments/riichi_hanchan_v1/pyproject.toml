[project]
name = "riichi-hanchan-v1"
version = "0.1.0"
description = "Four models play a full riichi mahjong hanchan against each other"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["verifiers", "jongbench"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["riichi_hanchan_v1"]
