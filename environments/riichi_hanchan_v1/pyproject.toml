[project]
name = "riichi-hanchan-v1"
version = "0.1.0rc4"
description = "Evaluate one model through a full riichi hanchan against fixed Mortal controls"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
tags = ["riichi", "mahjong", "multi-agent", "long-horizon", "eval", "v1"]
dependencies = [
    "verifiers>=0.3.0,<0.4",
    "jongbench[mortal]>=0.1.1 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "jongbench[mortal] @ https://github.com/jrhuc/jongbench/releases/download/jongbench-v0.1.0/jongbench-0.1.0-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=995c55ea95e77be0ff94898882e39ed27f5ad79aa51781b868af3aaab90f79a6 ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jongbench[mortal] @ https://github.com/jrhuc/jongbench/releases/download/jongbench-v0.1.0/jongbench-0.1.0-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=ae140ce2541a2ddc0ebccf4475aabbb0454db9ec7bd93d9af487d288c873cf09 ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/jrhuc/jongbench"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["riichi_hanchan_v1"]

[tool.verifiers.eval]
# Smoke size: four chair-rotated episodes. Real comparisons need a multiple of 4
# plus seed-block standard error; n=4 SE is about ±0.37 on the 0–1 placement scale.
num_examples = 4
rollouts_per_example = 1
