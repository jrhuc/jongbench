[project]
name = "riichi-decision-v1"
version = "0.1.0rc1"
description = "Score a model against Mortal on single riichi mahjong decisions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
tags = ["riichi", "mahjong", "single-turn", "rlvr", "precomputed-reward", "eval", "v1"]
dependencies = ["verifiers>=0.3.0,<0.4"]

[project.urls]
Repository = "https://github.com/jrhuc/jongbench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riichi_decision_v1"]

[tool.verifiers.eval]
num_examples = 128
rollouts_per_example = 1
