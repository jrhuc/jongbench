[project]
name = "jongbench"
version = "0.1.1"
description = "Benchmark LLMs playing riichi mahjong, graded by the Mortal deep-RL model"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["benchmark", "evaluation", "mahjong", "multi-agent", "riichi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
providers = ["openai>=1.50"]
mortal = ["torch>=2.4"]
benchmark = ["openai>=1.50", "torch>=2.4"]
dev = ["openai>=1.50", "pytest>=8.3", "torch>=2.4", "verifiers>=0.3.0,<0.4"]

[project.scripts]
jongbench = "jongbench.cli:main"
jongbench-experiment = "jongbench.experiments.cli:main"

[project.urls]
Repository = "https://github.com/jrhuc/jongbench"
Documentation = "https://github.com/jrhuc/jongbench#readme"

[build-system]
requires = [
    "semantic-version==2.10.0",
    "setuptools==84.0.0",
    "setuptools-rust==1.13.0",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools]
packages = ["jongbench", "jongbench.experiments"]
include-package-data = false

[tool.setuptools.package-data]
jongbench = ["*.html"]

[tool.setuptools.exclude-package-data]
jongbench = ["libriichi.so"]

[[tool.setuptools-rust.ext-modules]]
target = "jongbench.libriichi"
path = "libriichi/Cargo.toml"
binding = "PyO3"
debug = false
